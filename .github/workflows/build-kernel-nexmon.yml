name: Build kernel + AnyKernel (nexmon)

# Manually triggered build: compiles the angler NetHunter kernel, builds the
# nexmon monitor-mode firmware from source for the BCM4358, and packages both
# into a TWRP-flashable AnyKernel3 zip uploaded as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        default: "nethunter_defconfig"
        required: true
      build_nexmon:
        description: "Build and bundle the nexmon firmware"
        type: boolean
        default: true
      nexmon_ref:
        description: "seemoo-lab/nexmon git ref (branch/tag/commit)"
        default: "master"
        required: true
      nexmon_chip:
        description: "nexmon chip directory"
        default: "bcm4358"
        required: true
      nexmon_fwver:
        description: "nexmon firmware version directory"
        default: "7_112_300_14_sta"
        required: true

# Old toolchains (GCC 4.9) and the nexmon prebuilt buildtools are most reliable
# on the 22.04 image.
jobs:
  build:
    runs-on: ubuntu-22.04
    # Needed so the workflow can publish the flashable zip as a release.
    permissions:
      contents: write
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: github
      KBUILD_BUILD_HOST: actions
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex git gawk \
            kmod libssl-dev libncurses5-dev wget xz-utils zip unzip rsync \
            python3 \
            systemd hwdata usbutils \
            libc6:i386 libstdc++6:i386 zlib1g:i386

      # ---- Cross toolchains (AOSP prebuilt standalone GCC 4.9) --------------
      # The Kali toolchain mirror is unreliable. Pull the canonical Android
      # prebuilt GCC 4.9 toolchains from googlesource. NOTE: the repos' default
      # branch (main) no longer ships the gcc compiler driver (only binutils);
      # the full GCC 4.9 compiler still lives on the legacy nougat-release
      # branch, so we clone that explicitly.
      - name: Fetch cross toolchains
        run: |
          set -euo pipefail
          TC_BRANCH=nougat-release
          git clone --depth=1 -b "$TC_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/tc/aarch64"
          git clone --depth=1 -b "$TC_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$HOME/tc/armhf"

          CC64="$HOME/tc/aarch64/bin/aarch64-linux-android-gcc"
          CC32="$HOME/tc/armhf/bin/arm-linux-androideabi-gcc"
          if [ ! -x "$CC64" ] || [ ! -x "$CC32" ]; then
            echo "::error::gcc compiler driver missing (binutils-only toolchain branch?)"
            ls -la "$HOME/tc/aarch64/bin" || true
            exit 1
          fi
          echo "CROSS_COMPILE=${CC64%gcc}" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=${CC32%gcc}" >> "$GITHUB_ENV"
          echo "aarch64 prefix: ${CC64%gcc}"
          echo "armhf  prefix: ${CC32%gcc}"
          "$CC64" --version | head -n1

      # ---- Kernel ------------------------------------------------------------
      # This MSM tree forces CC through scripts/gcc-wrapper.py (a Python 2
      # script that scans for "forbidden warnings"). Under the runner's
      # Python 3 it raises SyntaxError and breaks every compile, and a
      # command-line CC= override does not propagate through the O= sub-make.
      # Replace the wrapper with a transparent Python 3 pass-through to the
      # real compiler (CC = gcc-wrapper.py $(REAL_CC), so argv[1:] is the
      # actual command to run). CI-only edit of the fresh checkout.
      - name: Neutralize Python2 gcc-wrapper
        run: |
          set -euo pipefail
          cat > scripts/gcc-wrapper.py <<'PYEOF'
          #!/usr/bin/env python3
          import os, sys
          args = sys.argv[1:]
          if not args:
              sys.exit("gcc-wrapper: no compiler command given")
          os.execvp(args[0], args)
          PYEOF
          chmod +x scripts/gcc-wrapper.py
          python3 -c "import ast; ast.parse(open('scripts/gcc-wrapper.py').read()); print('wrapper parses under python3')"

      - name: Build kernel (Image.gz-dtb)
        run: |
          set -euo pipefail
          # gcc-10+ defaults to -fno-common which breaks this 3.10-era tree;
          # silence host-tool warnings as well so the old code base builds.
          export KCFLAGS="-fcommon -w"
          # Stamp the kernel version string with the same tag the flashable zip
          # uses (date-sha8), so `uname -r` on the device matches the downloaded
          # AnyKernel zip name. Computed once here and reused by the zip step.
          STAMP="$(date +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-8)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # The 3.10 Makefile does not create O= itself; make it first.
          mkdir -p out
          make O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCFLAGS="-fcommon -w" \
            "${{ github.event.inputs.defconfig }}"
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCFLAGS="-fcommon -w" \
            LOCALVERSION="-$STAMP" \
            Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          # Show the resulting kernel release string for the build log.
          cat out/include/config/kernel.release 2>/dev/null \
            || strings out/arch/arm64/boot/Image.gz-dtb | grep -m1 "$STAMP" || true

      # ---- nexmon firmware (built from source) ------------------------------
      - name: Build nexmon firmware
        if: ${{ github.event.inputs.build_nexmon == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libgmp3-dev autoconf automake texinfo \
            libtool-bin qpdf flex bison libfl-dev
          # nexmon's b43 assembler links the legacy lex library via -ll, which
          # modern distros ship only as libfl. Provide a libl alias so the
          # linker resolves -ll.
          FLA="$(find /usr/lib -name 'libfl.a' 2>/dev/null | head -n1)"
          if [ -n "$FLA" ]; then
            sudo ln -sf "$FLA" "$(dirname "$FLA")/libl.a"
            echo "aliased $(dirname "$FLA")/libl.a -> $FLA"
          else
            echo "::warning::libfl.a not found; -ll may fail"
          fi
          git clone https://github.com/seemoo-lab/nexmon.git "$HOME/nexmon"
          cd "$HOME/nexmon"
          git checkout "${{ github.event.inputs.nexmon_ref }}"

          # Build the isl library required by the nexmon flashpatch toolchain.
          ( cd buildtools/isl-0.10 && CC=gcc ./configure && make -j"$(nproc)" && sudo make install )
          ARCHLIB="/usr/lib/$(gcc -dumpmachine)"
          sudo ln -sf /usr/local/lib/libisl.so "$ARCHLIB/libisl.so.10" || true
          sudo ldconfig

          # setup_env.sh exports NEXMON_ROOT and toolchain paths for the build.
          set +eu; source ./setup_env.sh; set -eu
          make            # build buildtools + libs

          PATCHDIR="patches/${{ github.event.inputs.nexmon_chip }}/${{ github.event.inputs.nexmon_fwver }}/nexmon"
          if [ ! -d "$PATCHDIR" ]; then
            echo "::error::nexmon patch dir not found: $PATCHDIR"
            echo "Available patches:"; ls -R patches | head -n 80
            exit 1
          fi

          # Harden the BCM4358 injection handler: upstream nexmon never checks
          # pkt_buf_get_skb() in NEX_INJECT_FRAME, so an injection flood that
          # exhausts the firmware SKB pool dereferences NULL and traps the
          # dongle (epc 0x216dfc -> PCIe linkdown / endless recovery). Add the
          # NULL guard newer chips already carry. Only applies to the affected
          # bcm4358 handler; no-op elsewhere or if already guarded.
          if [ "${{ github.event.inputs.nexmon_chip }}" = "bcm4358" ]; then
            NXP="$GITHUB_WORKSPACE/nexmon-patches"
            # NEX_INJECT_FRAME: NULL-check the SKB allocation (flood -> trap).
            [ -f "$PATCHDIR/src/ioctl.c" ] && \
              bash "$NXP/bcm4358-inject-null-check.sh" "$PATCHDIR/src/ioctl.c"
            # inject_frame(): bound the attacker-controlled radiotap length.
            [ -f "$PATCHDIR/src/injection.c" ] && \
              bash "$NXP/bcm4358-injection-len-check.sh" "$PATCHDIR/src/injection.c"
            # wl_monitor_radiotap(): reject runt frames (p->len - 6 underflow).
            [ -f "$PATCHDIR/src/monitormode.c" ] && \
              bash "$NXP/bcm4358-monitor-underflow-check.sh" "$PATCHDIR/src/monitormode.c"
            # free() NULL guard: hook the heap free() at 0x18234c so a NULL
            # buffer (besside-ng RX/event path under load) no longer traps the
            # dongle (epc 0x182352). Only for the 300_14 build the offsets match.
            if [ "${{ github.event.inputs.nexmon_fwver }}" = "7_112_300_14_sta" ]; then
              bash "$NXP/bcm4358-install-free-guard.sh" "$PATCHDIR/src" "$NXP"
            fi
          fi

          ( cd "$PATCHDIR" && make )

          FW="$(find "$PATCHDIR" -maxdepth 1 -name 'fw_bcmdhd.bin' | head -n1)"
          if [ -z "$FW" ]; then
            echo "::error::nexmon build did not produce fw_bcmdhd.bin"
            echo "Patch dir contents:"; ls -lh "$PATCHDIR"
            exit 1
          fi

          # Binary (address-based) patch applied to the LINKED firmware, after
          # make: defuse the WPS state-machine panic at 0x18554a so a reaver/
          # bully attack no longer traps the dongle (epc 0x0e0e0e10). Verifies
          # the target is `bl 0x182170` before touching anything; safe no-op if
          # the layout differs. Only for the 300_14 build the offsets match.
          if [ "${{ github.event.inputs.nexmon_chip }}" = "bcm4358" ] && \
             [ "${{ github.event.inputs.nexmon_fwver }}" = "7_112_300_14_sta" ]; then
            bash "$GITHUB_WORKSPACE/nexmon-patches/bcm4358-wps-assert-defuse.sh" "$FW"
            # NOTE: monitor-mode EAPOL truncation is NOT fixed — RE proved it
            # happens in ROM (wlc_monitor / its EAPOL handler) before any
            # RAM/nexmon code runs, with no free flashpatch slot. Not patchable
            # on this chip/firmware. See nexmon-patches/EAPOL-TRUNCATION-RE.md.
          fi

          mkdir -p "$GITHUB_WORKSPACE/anykernel/firmware"
          cp -f "$FW" "$GITHUB_WORKSPACE/anykernel/firmware/fw_bcmdhd.bin"
          ls -lh "$GITHUB_WORKSPACE/anykernel/firmware/fw_bcmdhd.bin"

          # Disassemble the RAM firmware around the call chain recovered from
          # the reaver/WPS control-flow trap (driver stack scan in dhd_pcie.c).
          # This turns the raw saved-LR addresses into annotated Thumb-2 so the
          # corrupting routine can be pinpointed and hooked. Diagnostic only;
          # prints into the build log, never fails the build.
          if [ "${{ github.event.inputs.nexmon_chip }}" = "bcm4358" ]; then
            pip3 install --quiet capstone || echo "::warning::capstone install failed"
            python3 "$GITHUB_WORKSPACE/nexmon-patches/bcm4358-disas-trap.py" \
              "$GITHUB_WORKSPACE/anykernel/firmware/fw_bcmdhd.bin" \
              || echo "::warning::trap disassembly step failed (non-fatal)"
          fi

          # logstrs.bin lets the dhd driver decode a dongle trap's epc into a
          # firmware function name (instead of a raw 0x2xxxxx address), which is
          # what pinpoints the offending firmware routine under injection
          # floods. The nexmon build emits it next to fw_bcmdhd.bin (or under
          # the firmware source tree); bundle it if present.
          LOGSTRS="$(find "$PATCHDIR" "$HOME/nexmon" -name 'logstrs.bin' 2>/dev/null | head -n1 || true)"
          if [ -n "$LOGSTRS" ]; then
            cp -f "$LOGSTRS" "$GITHUB_WORKSPACE/anykernel/firmware/logstrs.bin"
            echo "bundled logstrs.bin from $LOGSTRS"
            ls -lh "$GITHUB_WORKSPACE/anykernel/firmware/logstrs.bin"
          else
            echo "::warning::logstrs.bin not found; dongle traps will show raw epc only"
          fi

      # ---- udev hwdb for the Kali chroot ------------------------------------
      # Modern usbutils `lsusb` resolves names via libudev's hwdb
      # (udev_hwdb_new), but the Nexus 6P's systemd 260 cannot build hwdb.bin
      # on its 3.10 kernel (systemd-hwdb update fails to read its hwdb.d dirs:
      # "Protocol driver not attached"). libudev there can still mmap a
      # prebuilt file, so generate it on the runner and bundle it.
      - name: Generate udev hwdb.bin for the Kali chroot
        run: |
          set -euo pipefail
          sudo systemd-hwdb update
          mkdir -p anykernel/chroot-extras
          if [ -f /etc/udev/hwdb.bin ]; then
            cp /etc/udev/hwdb.bin anykernel/chroot-extras/hwdb.bin
          elif [ -f /usr/lib/udev/hwdb.bin ]; then
            cp /usr/lib/udev/hwdb.bin anykernel/chroot-extras/hwdb.bin
          else
            echo "::warning::hwdb.bin was not produced; lsusb name lookup unavailable"
          fi
          ls -l anykernel/chroot-extras/ || true

      # ---- AnyKernel3 package -----------------------------------------------
      - name: Assemble AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$HOME/ak3"
          # Drop AnyKernel's sample config/artifacts and overlay ours.
          rm -f "$HOME/ak3/anykernel.sh" "$HOME/ak3/Image"* "$HOME/ak3/zImage"* \
                "$HOME/ak3/Image.gz-dtb" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" "$HOME/ak3/anykernel.sh"
          cp out/arch/arm64/boot/Image.gz-dtb "$HOME/ak3/Image.gz-dtb"

          if [ -f "$GITHUB_WORKSPACE/anykernel/firmware/fw_bcmdhd.bin" ]; then
            mkdir -p "$HOME/ak3/firmware"
            cp "$GITHUB_WORKSPACE/anykernel/firmware/fw_bcmdhd.bin" "$HOME/ak3/firmware/fw_bcmdhd.bin"
            # Bundle logstrs.bin too if the firmware step produced it (enables
            # human-readable dongle-trap decoding on the device).
            if [ -f "$GITHUB_WORKSPACE/anykernel/firmware/logstrs.bin" ]; then
              cp "$GITHUB_WORKSPACE/anykernel/firmware/logstrs.bin" "$HOME/ak3/firmware/logstrs.bin"
              echo "nexmon firmware + logstrs.bin bundled."
            else
              echo "nexmon firmware bundled (no logstrs.bin)."
            fi
          else
            echo "::warning::No nexmon firmware bundled; zip will flash the kernel only."
          fi

          # Reuse the STAMP computed in the kernel build step (exported to
          # GITHUB_ENV) so the zip name matches the kernel's `uname -r` exactly.
          STAMP="${STAMP:-$(date +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-8)}"
          ZIP="angler-nethunter-nexmon-${STAMP}.zip"
          ( cd "$HOME/ak3" && zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x ".git*" -x "*.zip" )
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "TAG_NAME=build-${STAMP}" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/$ZIP"

          # Stage the prebuilt udev hwdb.bin as a standalone asset (NOT bundled
          # in the flashable zip): install it manually in the chroot via
          # curl/wget. See anykernel/chroot-extras/README.txt.
          if [ -f "$GITHUB_WORKSPACE/anykernel/chroot-extras/hwdb.bin" ]; then
            cp "$GITHUB_WORKSPACE/anykernel/chroot-extras/hwdb.bin" \
               "$GITHUB_WORKSPACE/hwdb.bin"
            ls -lh "$GITHUB_WORKSPACE/hwdb.bin"
          else
            echo "::warning::hwdb.bin not staged; lsusb name lookup asset unavailable"
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Upload udev hwdb.bin
        uses: actions/upload-artifact@v4
        with:
          name: hwdb.bin
          path: hwdb.bin
          if-no-files-found: warn

      # Publish the flashable zip to the repo's Releases page so it can be
      # downloaded directly (https://github.com/<owner>/<repo>/releases).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.ZIP_NAME }}
          body: |
            Automated build of the angler (Nexus 6P) NetHunter kernel with
            native monitor mode + nexmon-patched firmware.

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - nexmon firmware: `${{ github.event.inputs.build_nexmon }}`
              (chip `${{ github.event.inputs.nexmon_chip }}`, ver `${{ github.event.inputs.nexmon_fwver }}`)

            Flash the attached zip in TWRP. The installer flashes the kernel
            and installs the bundled `fw_bcmdhd.bin` (a backup of the stock
            firmware is kept as `fw_bcmdhd.bin.stock`).

            `hwdb.bin` is attached separately (it is NOT in the zip). It fixes
            `lsusb` ("unable to initialize usb spec") inside the Kali chroot.
            Install it manually from the chroot, e.g.:

                wget -O /etc/udev/hwdb.bin \
                  https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/hwdb.bin

            (or `curl -L -o /etc/udev/hwdb.bin <url>`). See
            anykernel/chroot-extras/README.txt.
          files: |
            ${{ env.ZIP_NAME }}
            hwdb.bin
          fail_on_unmatched_files: false
